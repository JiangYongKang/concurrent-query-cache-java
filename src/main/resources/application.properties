server.port=0

# ===== 查询加速层配置（query-cache）=====
# 缓存有效期（毫秒）：在此期间直接命中 HIT，不触发底层计算
query-cache.ttl-millis=5000
# 过期旧值可用于降级的宽限窗口（毫秒）：expireAt ~ expireAt+staleAcceptedMillis 之间可降级
query-cache.stale-accepted-millis=15000
# 底层失败/超时时是否允许返回带 degraded=true 标记的旧值（降级总开关，默认关闭）
query-cache.stale-on-failure-allowed=false
# 底层计算全局并发上限：超过的请求排队等待许可
query-cache.compute-concurrency=2
# 单键合并等待队列容量（不含正在计算的 leader）：超出立即以 QUEUE_FULL(429) 快速失败
query-cache.max-waiters-per-key=10
# 合并等待/获取计算许可的超时（毫秒）：超时以 WAIT_TIMEOUT(504) 失败
query-cache.wait-timeout-millis=1000
# 单次底层计算超时（毫秒）：超时以 COMPUTE_TIMEOUT(504) 失败且不写缓存，并中断底层任务
query-cache.compute-timeout-millis=2000

logging.level.com.github.highcumontoa=INFO
