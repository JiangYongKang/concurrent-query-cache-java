server.port=8080

# 查询加速层配置
query-cache.ttl-millis=1000
query-cache.stale-fallback-enabled=true
query-cache.max-concurrency=4
query-cache.queue-capacity=16
query-cache.acquire-timeout-millis=500
query-cache.compute-timeout-millis=2000
query-cache.coalesce-wait-capacity=32
query-cache.coalesce-wait-timeout-millis=5000
query-cache.simulated-delay-millis=100
